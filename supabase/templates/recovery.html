<h2>Redefinir senha</h2>
<p>Use o código abaixo no app BioScanner para escolher uma nova senha:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
<p>O código vale por 1 hora. Se você não pediu para redefinir a senha, ignore este email: sua senha continua a mesma.</p>
